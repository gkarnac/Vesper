<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0714">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vesper">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Vesper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0714;--bg2:#120a20;--bg3:#1a1030;
  --txt:#ece4f7;--txt2:rgba(236,228,247,.62);--txt3:rgba(236,228,247,.34);
  --line:rgba(255,255,255,.08);
  --cyan:#4bc6ff;--mag:#ff4bd8;--dusk:#ff8a4c;--gold:#f2b66d;
  --serif:'Cormorant Garamond',Georgia,serif;--mono:'JetBrains Mono',monospace;
  --fog:.4;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg);color:var(--txt);font-family:var(--serif);min-height:100vh;max-width:520px;margin:0 auto;
  padding:0 0 calc(40px + env(safe-area-inset-bottom));position:relative;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:50;
  background-image:repeating-linear-gradient(to bottom,rgba(255,255,255,.02) 0,rgba(255,255,255,.02) 1px,transparent 1px,transparent 3px);mix-blend-mode:overlay}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}

.top{display:flex;justify-content:space-between;align-items:center;padding:calc(18px + env(safe-area-inset-top)) 18px 10px}
.logo{font-size:26px;letter-spacing:.32em;font-weight:500;color:var(--txt);text-transform:uppercase}
.logo i{color:var(--mag);font-style:normal}
.pill{font-family:var(--mono);font-size:10px;letter-spacing:.1em;padding:5px 10px;border:1px solid var(--cyan);color:var(--cyan);
  border-radius:2px;background:rgba(75,198,255,.08)}
.pill.err{border-color:var(--mag);color:var(--mag);background:rgba(255,75,216,.08)}
.kicker{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--txt3);padding:0 18px}

.art{position:relative;width:100%;aspect-ratio:400/230;overflow:hidden;background:var(--bg2)}
.art svg,.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.art .fogv{position:absolute;inset:0;pointer-events:none;opacity:var(--fog);
  background:linear-gradient(180deg,transparent 20%,rgba(242,182,109,.55) 85%,rgba(242,182,109,.8));mix-blend-mode:screen;animation:drift 14s ease-in-out infinite alternate}
.art::after{content:'';position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(180deg,transparent,var(--bg))}
@keyframes drift{from{transform:translateX(-3%) scale(1.06)}to{transform:translateX(3%) scale(1.06)}}

.wrap{padding:0 18px}
h1.title{font-size:34px;font-weight:500;letter-spacing:.02em;line-height:1.1;margin:-34px 0 6px;position:relative;z-index:2}
.sub{font-family:var(--mono);font-size:11px;color:var(--txt2);letter-spacing:.08em}
.btn{display:block;width:100%;padding:14px 16px;border:1px solid var(--mag);color:#fff;background:rgba(255,75,216,.12);
  font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;border-radius:2px;margin-top:16px;
  box-shadow:0 0 22px rgba(255,75,216,.18)}
.btn:active{background:rgba(255,75,216,.28)}
.btn.cy{border-color:var(--cyan);background:rgba(75,198,255,.1);box-shadow:0 0 22px rgba(75,198,255,.15)}
.btn.ghost{border-color:var(--line);background:transparent;color:var(--txt2);box-shadow:none}
.btn[disabled]{opacity:.35;pointer-events:none}

.dots{display:flex;flex-wrap:wrap;gap:5px;margin:18px 0 6px}
.dot{flex:none;width:14px;height:14px;border:1px solid var(--line);border-radius:50%;background:transparent}
.dot.done{background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 8px rgba(75,198,255,.5)}
.dot.cur{border-color:var(--mag);box-shadow:0 0 10px rgba(255,75,216,.6);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 2px rgba(255,75,216,.2)}}

.card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01));padding:14px 14px;margin-top:18px;border-radius:2px}
.card h3{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--txt3);font-weight:500;margin-bottom:10px}
.bar{height:5px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden;margin:8px 0}
.bar>div{height:100%;background:linear-gradient(90deg,var(--dusk),var(--gold));transition:width .6s}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mini{font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;color:var(--cyan);border:1px solid var(--cyan);padding:7px 8px;border-radius:2px;background:rgba(75,198,255,.07);white-space:nowrap}
.mini.off{border-color:var(--line);color:var(--txt3);background:none}
.ok{color:var(--cyan);font-family:var(--mono);font-size:11px}

.list{margin-top:6px}
.li{display:flex;gap:12px;align-items:baseline;padding:11px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.li .n{font-family:var(--mono);font-size:11px;color:var(--txt3);min-width:22px}
.li .t{font-size:19px}
.li.lock{opacity:.32;pointer-events:none}
.li.cur .t{color:#fff}.li.cur .n{color:var(--mag)}
.li .c{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--cyan)}

/* lecteur */
.nav{display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top)) 14px 10px}
.nav button{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--txt2);padding:8px 6px;text-transform:uppercase}
.nav button[disabled]{opacity:.25}
.story{padding:6px 22px 0}
.story .meta{font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:var(--mag);text-transform:uppercase;margin-top:-6px;position:relative;z-index:2}
.story h2{font-size:32px;font-weight:500;line-height:1.1;margin:6px 0 20px;position:relative;z-index:2}
.story p{font-size:21px;line-height:1.62;margin-bottom:18px;color:#e6dcf4;opacity:0;transform:translateY(6px);animation:rise .9s forwards}
.story p:first-of-type::first-letter{font-size:48px;float:left;line-height:.85;padding:5px 8px 0 0;color:var(--gold)}
@keyframes rise{to{opacity:1;transform:none}}
.passage{margin:26px 18px 0;border:1px solid var(--cyan);background:rgba(75,198,255,.05);padding:16px;font-family:var(--mono);border-radius:2px;
  box-shadow:0 0 26px rgba(75,198,255,.1);opacity:0;animation:rise 1s forwards}
.passage .ph{font-size:10px;letter-spacing:.22em;color:var(--cyan);text-transform:uppercase}
.passage .pt{font-size:16px;margin:6px 0 10px;color:#fff}
.passage .pl{font-size:12.5px;line-height:1.7;color:var(--txt2)}
.passage .pl div::before{content:'› ';color:var(--cyan)}

/* joueur */
.player{min-height:100vh;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top)) 22px 28px;position:relative;
  background:radial-gradient(ellipse at 50% 0,rgba(255,75,216,.14),transparent 60%),var(--bg)}
.player>*{position:relative;z-index:2}
.player>.pbg{position:absolute;inset:0;z-index:0;overflow:hidden}
.pbg svg,.pbg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pbg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,7,20,.55),rgba(11,7,20,.35) 40%,rgba(11,7,20,.88))}
.pbg .fogv{position:absolute;inset:0;opacity:var(--fog);background:linear-gradient(180deg,transparent 30%,rgba(242,182,109,.5));mix-blend-mode:screen;animation:drift 14s ease-in-out infinite alternate}
.player .ph{font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:var(--cyan);text-transform:uppercase}
.player .nm{font-size:30px;line-height:1.15;margin:46px 0 6px;font-weight:500}
.player .dt{font-family:var(--mono);font-size:12px;color:var(--txt2);min-height:18px}
.player .tm{font-family:var(--mono);font-size:68px;font-weight:500;letter-spacing:.03em;margin:34px 0 8px;color:var(--gold);text-shadow:0 0 24px rgba(242,182,109,.4)}
.player .tm.rest{color:var(--cyan);text-shadow:0 0 24px rgba(75,198,255,.4)}
.player .nx{font-family:var(--mono);font-size:11px;color:var(--txt3);margin-top:6px}
.player .sp{flex:1}
.player .ctl{display:flex;gap:10px}.player .ctl .btn{margin-top:0}
.fin{text-align:center;padding-top:70px}
.fin .big{font-size:36px;font-weight:500;margin-bottom:12px}
.fin p{color:var(--txt2);font-size:19px;line-height:1.5;margin-bottom:10px}

.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--bg3);border:1px solid var(--cyan);
  font-family:var(--mono);font-size:12px;padding:10px 16px;z-index:100;border-radius:2px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
.sv h2{font-size:30px;font-weight:500;margin:34px 0 4px}
.sv .lead{color:var(--txt2);font-size:18px;margin-bottom:6px}
.sv label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--txt3);margin:20px 0 8px}
.grid{display:flex;flex-wrap:wrap;gap:6px}
.nb{min-width:36px;height:36px;padding:0 8px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--txt2);font-family:var(--mono);font-size:12px;font-weight:600;border-radius:2px}
.nb.on{background:var(--cyan);color:#001018;border-color:var(--cyan);box-shadow:0 0 12px rgba(75,198,255,.4)}
.nb.on.pn{background:var(--mag);border-color:var(--mag);color:#1a0016;box-shadow:0 0 12px rgba(255,75,216,.4)}
.tag{padding:8px 11px;border:1px solid var(--line);color:var(--txt2);font-family:var(--mono);font-size:11px;border-radius:2px;background:rgba(255,255,255,.03)}
.tag.on{border-color:var(--mag);color:#fff;background:rgba(255,75,216,.18)}
.exq{margin-bottom:12px}.exq .en{font-size:18px;margin-bottom:6px}
.exq .grid .nb{flex:1}
.nb.fac.on{background:#1D9E75;border-color:#1D9E75;color:#fff}.nb.dur.on{background:#D85A30;border-color:#D85A30;color:#fff}
.sv input[type=text]{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--txt);padding:12px;font-family:var(--serif);font-size:17px;border-radius:2px}
.foot{font-family:var(--mono);font-size:10px;color:var(--txt3);text-align:center;margin-top:30px;letter-spacing:.06em;line-height:1.8}
.foot a{color:var(--txt2)}
.hide{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<audio id="aud" preload="auto" playsinline></audio>
<script src="story/chapitre0.js"></script>
<script>
'use strict';
// ───────────────────────── CONFIG ─────────────────────────
const APP_VERSION = '12 nov. 15 h 10';
const API = 'https://script.google.com/macros/s/AKfycbx49E1O2B0xSnjkFEh2TbCsn6rDSMFkiqoWRTWkRXWTMXL-Y_BmLOsrxjKHqb9KBrjeGg/exec';
const MP3_BASE = 'https://gkarnac.github.io/ma-vie/';   // narrations des séances, hébergées avec Ma Vie
const MA_VIE_URL = 'https://gkarnac.github.io/ma-vie/';
const START = '2026-11-09';          // début du niveau 0 (même départ que Ma Vie)
const SOBRE_HAB_ID = 'sobre-jour';
const MOTS_ALCOOL = ['bière','biere','vin','alcool','cidre','fort','scotch','whisky','vodka','rhum','gin','cocktail'];
const CH = window.VESPER_CH0;
const CACHE_KEY = 'vesper_cache_v1', PEND_KEY = 'vesper_pending_v1', LUE_KEY = 'vesper_lues_v1';

// ───────────────────── PASSAGES (niveau 0) ─────────────────────
// Mêmes séances que la semaine de reprise de Ma Vie. Index = (scène − 1) mod 9.
const mp = (f, nom, d, ex) => ({ mp3: f, nom, duree: d, ex: ex || null });
const tm = (nom, d, detail) => ({ timer: nom, duree: d, detail: detail || '' });
const ps = d => ({ pause: d });
const WARM = mp('warmup.mp3', 'Échauffement Wing Chun', 410);
const KICK = mp('kicks.mp3', 'Kicks — 5 types', 232);
const PHA  = mp('physio-A.mp3', 'Physio WCT — Abduction hanche', 307);
const PHB  = mp('physio-B.mp3', 'Physio WCT — Flexion hanche', 835);
const FORME = (n) => tm(n + ' — Tam Lê', 420, 'Sans veste — forme complète');
const PASSAGES = [
  { type: 'Reprise — Formes + Marche', steps: [WARM, ps(30), KICK, ps(30), FORME('Siu Lim Tao'), ps(30), PHA] },
  { type: 'Reprise — Formes + Marche', steps: [tm('Marche — 30 min', 1800, 'Sans charge · rythme confortable · note la tension cervicale'), ps(30), mp('cervical-circuit.mp3', 'Circuit cervical', 310)] },
  { type: 'Reprise — Physio B', steps: [WARM, ps(30), PHB] },
  { type: 'Reprise — Formes', steps: [WARM, ps(30), KICK, ps(30), FORME('Chum Kiu'), ps(20), FORME('Biu Jee'), ps(30), PHA] },
  { type: 'Reprise — Physio + Gainage + Marche', steps: [WARM, ps(30), PHB, ps(30), mp('core-circuit.mp3', 'Circuit gainage', 526, [['ex-022','Hollow body hold'],['ex-023','Levées de jambes'],['ex-050','Dead bug']])] },
  { type: 'Reprise — Physio + Gainage + Marche', steps: [tm('Marche — 35 min', 2100, 'Sans charge · rythme confortable'), ps(30), mp('cooldown.mp3', 'Retour au calme', 531)] },
  { type: 'Reprise — Formes + Armes', steps: [WARM, ps(30), FORME('Siu Lim Tao'), ps(20), FORME('Baat Jaam Do'), ps(20), tm('Baat Jaam Do — Ip Man', 420, '')] },
  { type: 'Reprise — Marche longue', steps: [tm('Marche longue — 40 min', 2400, 'Ou sortie de 4-5 km · sans charge · note la tension cervicale à 30 min')] },
  { type: 'Yoga — Iyengar Leçon 1', steps: [mp('dimanche-yoga.mp3', 'Yoga Iyengar — Leçon 1', 1487)] },
];
const passageDe = n => PASSAGES[(n - 1) % 9];
// Semaine type du niveau 0 (même programme que Ma Vie). p = index du passage (0-8) ; sinon libre.
const DESC = ['Formes · Siu Lim Tao, kicks, physio', 'Marche 30 min + circuit cervical', 'Physio B · flexion de hanche', 'Formes · Chum Kiu, Biu Jee',
  'Physio B + circuit gainage', 'Marche 35 min + retour au calme', 'Formes + armes (Baat Jaam Do)', 'Marche longue 40 min', 'Yoga Iyengar · leçon 1'];
const JOURS_FR = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
const PLAN_SEM = [
  [{ m: 'Matin', p: 0 }, { m: 'Soir', p: 1 }],
  [{ m: 'Matin', p: 2 }, { m: 'Soir', libre: 'Repos — récupération' }],
  [{ m: 'Matin', p: 3 }, { m: 'Soir', libre: 'Atelier — soirée libre' }],
  [{ m: 'Matin', p: 4 }, { m: 'Soir', p: 5 }],
  [{ m: 'Matin', p: 6 }, { m: 'Soir', libre: 'Atelier — soirée libre' }],
  [{ m: 'Matin ou soir', p: 7 }],
  [{ m: 'Matin', p: 8 }, { m: 'Soir', libre: 'Atelier — soirée libre' }]
];
const idxJour = d => (new Date(d + 'T12:00:00').getDay() + 6) % 7;
function faitesAujourdhui() {
  const ids = new Set(); (S.wcSeances || []).forEach(x => { if (x && x.statut === 'Complété' && dstr(x.date) === today()) ids.add(x.id || Math.random()); });
  return ids.size;
}
function carteAujourdhui() {
  const td = today(), plan = PLAN_SEM[idxJour(td)], faites = faitesAujourdhui();
  let k = 0, h = '<div class="card"><h3>Au programme · ' + JOURS_FR[idxJour(td)] + '</h3>';
  plan.forEach(e => {
    if (e.libre) { h += '<div class="row" style="padding:6px 0"><div style="color:var(--txt3);font-size:18px">' + e.m + ' · ' + esc(e.libre) + '</div></div>'; return; }
    const fait = k < faites; k++;
    h += '<div class="row" style="padding:6px 0;flex-wrap:nowrap"><div style="font-size:18px;' + (fait ? 'color:var(--txt3)' : '') + '">' + e.m + ' · ' + esc(DESC[e.p]) + '</div><span class="' + (fait ? 'ok' : 'sub') + '">' + (fait ? '✓' : 'à faire') + '</span></div>';
  });
  const dem = PLAN_SEM[(idxJour(td) + 1) % 7];
  h += '<div class="sub" style="margin-top:8px;line-height:1.6">Demain · ' + JOURS_FR[(idxJour(td) + 1) % 7] + ' : ' + dem.map(e => e.m.split(' ')[0] + ' ' + (e.libre ? e.libre.split(' —')[0].toLowerCase() : DESC[e.p])).join(' · ') + '</div></div>';
  return h;
}
const dureeMin = p => Math.round(p.steps.reduce((a, s) => a + (s.duree || s.pause || 0), 0) / 60);

// ───────────────────────── ÉTAT ─────────────────────────
const S = { sessions: [], wcSeances: [], journal: [], sync: 'idle', view: 'home', scene: 1, lues: {}, pending: [], play: null };
function jget(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
function jset(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const $ = id => document.getElementById(id);
function localDateStr(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
const today = () => localDateStr(new Date());
const dstr = x => String(x).replace(/^"+|"+$/g, '').slice(0, 10);
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2400); }

// ───────────────────────── DONNÉES (même Sheet que Ma Vie) ─────────────────────────
async function api(params) {
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 20000);
  try { const r = await fetch(API + '?' + new URLSearchParams(params).toString(), { signal: ctl.signal }); return await r.json(); }
  finally { clearTimeout(to); }
}
function saveCache() { jset(CACHE_KEY, { sessions: S.sessions, wcSeances: S.wcSeances, journal: S.journal }); }
function normSeances(l) { return (l || []).map(x => { if (x && typeof x.date === 'string') x.date = dstr(x.date); return x; }).filter(x => x && x.statut !== 'Doublon'); }
function parseJournal(rows) {
  return (rows || []).filter(e => e.id).map(e => ({ date: dstr(e.date), medications: (() => { try { return JSON.parse(e.medications || '[]'); } catch (x) { return []; } })() }));
}
async function flushPending() {
  if (!S.pending.length) return;
  const reste = [];
  for (const it of S.pending) {
    try {
      const res = it.kind === 'seance' ? await api({ action: 'saveWcSeance', data: JSON.stringify(it.payload) })
                : it.kind === 'journal' ? await api({ action: 'save', entry: JSON.stringify(it.payload) })
                : await api({ action: 'saveSession', session: JSON.stringify(it.payload) });
      if (res && res.ok === false) reste.push(it);
    } catch (e) { reste.push(it); }
  }
  S.pending = reste; jset(PEND_KEY, reste);
}
async function sync() {
  S.sync = 'loading'; renderPill();
  try {
    await flushPending();
    const d = await api({ action: 'getAll' });
    if (!d.ok) throw new Error(d.error || 'Erreur');
    const attente = new Set(S.pending.map(p => String(p.payload.id)));
    let ws = normSeances(d.wcSeances), ss = d.sessions || [];
    // ce qui n'est pas encore parti reste visible
    S.pending.forEach(p => {
      if (p.kind === 'journal') return;
      if (p.kind === 'seance' && !ws.some(x => String(x.id) === String(p.payload.id))) ws.push(p.payload);
      if (p.kind === 'session' && !ss.some(x => String(x.id) === String(p.payload.id))) ss.push(p.payload);
    });
    S.wcSeances = ws; S.sessions = ss; S.journal = parseJournal(d.journal);
    S.sync = 'ok'; saveCache();
  } catch (e) { S.sync = 'err'; }
  renderPill(); render();
}

// ───────────────────────── PROGRESSION ─────────────────────────
// Nombre de séances « Complété » depuis le départ, sans doublons (même règle que Ma Vie).
function seancesFaites() {
  const vus = new Set(), gardes = [];
  (S.wcSeances || []).forEach(x => {
    if (!x || x.statut !== 'Complété') return;
    const d = dstr(x.date); if (d < START) return;
    const id = x.id || (d + '|' + x.type + '|' + x.duree);
    if (vus.has(id)) return;
    const t = parseInt(String(x.id || '').replace(/\D/g, ''), 10) || 0;
    const cle = d + '|' + x.type + '|' + x.duree;
    if (t && gardes.some(g => g.cle === cle && g.t && Math.abs(g.t - t) < 300000)) return;

let wake = null;

document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.play && !S.play.fini) wakeOn(); });

function startPassage(n) {
  const aud = $('aud');
  S.play = { n, steps: passageDe(n).steps, i: -1, pause: false, fini: false, end: 0, rest: 0 };
  // déverrouille l'audio sur ce geste de l'utilisateur
  try { aud.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA='; aud.play().catch(() => {}); } catch (e) {}

}
function nextStep() {
  const P = S.play, aud = $('aud'); aud.onended = null; aud.onerror = null; aud.pause();

  const el = $('tm'); if (el) el.textContent = fmt(Math.max(0, left));
  const tot = $('tot'); if (tot) tot.textContent = fmt(restTotal(Math.max(0, left)));

  const note = ($('sv-note') || {}).value || '';
  stopPlay();
  await enregistrerSeance(n, sv.rpe, sansSuivi ? null : { pain: sv.pain, locs: sv.locs || [], evals: sv.evals || {}, note: note.trim() });
  S.play = null;
  const next = prochaineScene(); S.lues[n] = 1; jset(LUE_KEY, S.lues);
  go(next <= CH.scenes.length ? 'read' : 'home', next <= CH.scenes.length ? next : 0);
}

// ───────────────────────── DÉMARRAGE ─────────────────────────
(function init() {
  const c = jget(CACHE_KEY, null);
  if (c) { S.sessions = c.sessions || []; S.wcSeances = c.wcSeances || []; S.journal = c.journal || []; }
  S.pending = jget(PEND_KEY, []); S.lues = jget(LUE_KEY, {});
  render(); sync();
})();
</script>
